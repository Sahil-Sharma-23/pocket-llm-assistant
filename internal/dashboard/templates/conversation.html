{{define "content"}}
<h2>{{.Conversation.Channel}} · {{if .Conversation.Title}}{{.Conversation.Title}}{{else}}{{.Conversation.ExternalID}}{{end}}</h2>
<div class="chat">
{{range .Messages}}
  <div class="msg {{.Role}}"><div class="meta">{{.Role}}{{if .Agent}} · {{.Agent}}{{end}} · {{t .CreatedAt}}</div>{{.Content}}</div>
{{else}}<p class="muted">Empty.</p>{{end}}
</div>
{{end}}
